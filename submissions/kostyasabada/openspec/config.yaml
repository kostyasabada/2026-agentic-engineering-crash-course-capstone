schema: spec-driven

context: |
  Educational capstone: a chat between people.
  Application framework: Next.js (user decision). Define the remaining stack in the design.
  Write all project artifacts in English; preserve required OpenSpec format markers.
  Project boundary: submissions/kostyasabada/. Do not modify course files.
  Read details as needed using the context map in AGENTS.md.
  Keep requirements in OpenSpec without duplicating them in other documents.

rules:
  proposal:
    - State the goal, scope, and non-goals of the change.
  specs:
    - Add verifiable scenarios for requirements, including failure cases.
  design:
    - Distinguish accepted decisions, proposals, and open questions.
    - Specify browser E2E tests with @playwright/test (dev dependency), including configuration, test location, dev server startup, and the exact run command.
    - Specify scripts/agent-loop.sh (interface and arguments, claude -p or codex exec agent selection, iteration limit defaulting to 5, stop conditions, and the loop-run.log format) and the Claude Code SessionStart hook in .claude/settings.json running the pinned OpenSpec list --json command (configuration, output, failure behavior, and Codex parity or its documented limitation).
  tasks:
    - Include appropriate checks and recording of actual results.
    - Keep the main agent as coordinator only; require a fresh maker subagent per task and a separate checker, with scoped context and no full history by default. Follow docs/review-process.md for handoffs, fixes, evidence, and completion criteria.
    - Include a task that runs a real task through scripts/agent-loop.sh and commits its docs/evidence/<task-id>/loop-run.log, and a task that records the actual output of the SessionStart hook as evidence. A loop result still requires separate checker acceptance.
